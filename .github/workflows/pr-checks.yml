name: PR Checks
on:
  pull_request:
    branches: [master]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Docker build smoke test
        run: docker build -t smoke-test:pr .
